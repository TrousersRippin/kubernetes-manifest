---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /app/data/data.db

    endpoints:
      - name: grafana
        group: monitoring
        url: "http://grafana.monitoring.svc.cluster.local:3000/api/health"
        interval: 30s
        conditions:
          - "[STATUS] == 200"

      - name: prometheus
        group: monitoring
        url: "http://prometheus.monitoring.svc.cluster.local:9090/-/healthy"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
